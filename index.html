<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Ordering</title>
    <meta name="description" content="Direct food ordering, delivery zone validation, secure payments, and real-time order tracking." />
    <meta property="og:title" content="Food Ordering" />
    <meta property="og:description" content="Direct food ordering, delivery zone validation, secure payments, and real-time order tracking." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#E23744" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Food Ordering" />
    <meta name="application-name" content="Food Ordering" />
    <link rel="manifest" href="/api/manifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preload" as="image" href="/src/assets/images/hero_artisanal_feast_1793975537331.webp" type="image/webp" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var cachedShopName = localStorage.getItem('storefront_shop_name_v1');
          if (cachedShopName && cachedShopName.trim()) {
            var name = cachedShopName.trim();
            var p = window.location.pathname || '';
            var h = window.location.hash || '';
            if (p.indexOf('/admin') === 0) {
              document.title = name + ' Admin';
            } else if (p.indexOf('/rider') === 0) {
              document.title = name + ' — Rider';
            } else if (p.indexOf('/track/') === 0 || h.indexOf('#/order/') === 0) {
              document.title = name + ' — Order Tracking';
            } else {
              document.title = name;
            }
            var appleMeta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (appleMeta) appleMeta.setAttribute('content', name);
            var ogMeta = document.querySelector('meta[property="og:title"]');
            if (ogMeta) ogMeta.setAttribute('content', name);
            var appMeta = document.querySelector('meta[name="application-name"]');
            if (appMeta) appMeta.setAttribute('content', name);
          }
        } catch (e) {}
        try {
          var raw = localStorage.getItem('aangan_theme_cache_v1');
          if (!raw) return;
          var t = JSON.parse(raw);
          var root = document.documentElement;
          if (t.isDark) root.classList.add('dark');
          else root.classList.remove('dark');
          if (t.bg) root.style.setProperty('--color-bg', t.bg);
          if (t.surface) root.style.setProperty('--color-surface', t.surface);
          if (t.softTint) {
            root.style.setProperty('--color-soft-tint', t.softTint);
            root.style.setProperty('--aangan-soft-tint', t.softTint);
          }
          if (t.text) root.style.setProperty('--color-text', t.text);
          if (t.muted) root.style.setProperty('--color-muted', t.muted);
          if (t.border) root.style.setProperty('--color-border', t.border);
          if (t.primary) root.style.setProperty('--color-primary', t.primary);
          if (t.primaryContrast) root.style.setProperty('--color-primary-contrast', t.primaryContrast);
          if (t.accent) root.style.setProperty('--color-accent', t.accent);
          if (t.radius) root.style.setProperty('--radius', t.radius);
          if (t.displayFont) root.style.setProperty('--font-display', t.displayFont);
          if (t.bodyFont) root.style.setProperty('--font-body', t.bodyFont);
        } catch (e) {}
      })();
    </script>
    <script src="https://checkout.razorpay.com/v1/checkout.js" async></script>
  </head>
  <body class="bg-bg text-text antialiased selection:bg-primary selection:text-primary-contrast">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
